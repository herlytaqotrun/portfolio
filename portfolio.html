<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Portfolio — Herlyta Qotrun Nada</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0f172a;--bg2:#1e293b;--bg3:#162032;--border:#2d3e55;--cyan:#22d3ee;--emerald:#34d399;--text:#e2e8f0;--muted:#94a3b8;--card:#172033;--radius:14px}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.7}
    a{color:var(--cyan);text-decoration:none}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(15,23,42,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,5vw,3rem)}
    .nav-logo{font-weight:800;font-size:1.1rem;background:linear-gradient(90deg,var(--cyan),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-back{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.88rem;font-weight:600;transition:color .2s}
    .nav-back:hover{color:var(--cyan);text-decoration:none}

    /* HERO */
    .p-hero{padding:10rem 0 5rem;text-align:center;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(34,211,238,.1) 0%,transparent 65%),var(--bg)}
    .p-hero-label{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:.75rem}
    .p-hero h1{font-size:clamp(2.5rem,7vw,5rem);font-weight:900;letter-spacing:-2px;line-height:1.05;margin-bottom:1rem;background:linear-gradient(135deg,#f1f5f9 30%,var(--cyan) 70%,var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .p-hero p{color:var(--muted);max-width:560px;margin:0 auto 2rem;font-size:1rem}

    /* FILTER TABS */
    .filter-wrap{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:2rem 1rem 3rem}
    .filter-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:.4rem 1.1rem;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
    .filter-btn:hover,.filter-btn.active{background:rgba(34,211,238,.12);border-color:var(--cyan);color:var(--cyan)}

    /* GRID */
    .container{max-width:1100px;margin:0 auto;padding:0 clamp(1rem,5vw,2.5rem)}
    .p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;padding-bottom:6rem}
    .p-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column}
    .p-card:hover{transform:translateY(-5px);border-color:rgba(34,211,238,.4);box-shadow:0 16px 48px rgba(0,0,0,.4)}
    .p-card-img{width:100%;height:200px;object-fit:cover;display:block}
    .p-card-placeholder{width:100%;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted)}
    .p-card-placeholder .emoji{font-size:2.8rem}
    .p-card-body{padding:1.25rem 1.4rem 1.5rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
    .p-card-cat{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan)}
    .p-card-title{font-size:1rem;font-weight:700}
    .p-card-desc{font-size:.83rem;color:var(--muted);line-height:1.6;flex:1}
    .p-card-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;color:var(--emerald);margin-top:.5rem;transition:gap .2s}
    .p-card-link:hover{gap:.7rem;text-decoration:none}
    .p-card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
    .p-tag{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:.15rem .6rem;font-size:.7rem;font-weight:500;color:var(--text)}

    /* EMPTY STATE */
    .empty{display:none;text-align:center;padding:5rem 1rem;color:var(--muted)}
    .empty.show{display:block}

    /* UPLOAD HINT */
    .upload-hint{background:rgba(34,211,238,.06);border:1px dashed rgba(34,211,238,.3);border-radius:var(--radius);padding:2rem;text-align:center;margin-bottom:3rem}
    .upload-hint h3{color:var(--cyan);font-size:1rem;margin-bottom:.5rem}
    .upload-hint p{color:var(--muted);font-size:.85rem}

    .fade-up{opacity:0;transform:translateY(24px);transition:opacity .55s,transform .55s}
    .fade-up.visible{opacity:1;transform:translateY(0)}
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">HQN.</div>
  <a class="nav-back" href="index.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Profile
  </a>
</nav>

<div class="p-hero">
  <div class="container">
    <span class="p-hero-label">Work & Projects</span>
    <h1>My Complete Portfolio</h1>
    <p>A collection of my work across web design, graphic design, video, marketing, and more.</p>
  </div>
</div>

<!-- FILTER TABS -->
<div class="filter-wrap">
  <button class="filter-btn active" data-filter="all">All Work</button>
  <button class="filter-btn" data-filter="web">Web Design</button>
  <button class="filter-btn" data-filter="product">Product Design</button>
  <button class="filter-btn" data-filter="graphic">Graphic Design</button>
  <button class="filter-btn" data-filter="visual">Visual Design</button>
  <button class="filter-btn" data-filter="copy">Copywriting</button>
  <button class="filter-btn" data-filter="video">Video Editing</button>
  <button class="filter-btn" data-filter="marketing">Digital Marketing</button>
  <button class="filter-btn" data-filter="social">Social Media</button>
</div>

<div class="container">
  <div class="p-grid" id="pgrid"></div>
  <div class="empty" id="empty">Belum ada karya di kategori ini.</div>
</div>

<script>
/* =====================================================================
   ✏️ TAMBAH KARYA KAMU DI SINI!
   Salin satu blok dan edit sesuai karya kamu.

   category: "web" | "product" | "graphic" | "visual" | "copy" | "video" | "marketing" | "social"
   image: nama file gambar (taruh di folder portfolio) — kosongkan jika belum ada
   link: URL kalau ada link live / GitHub / behance (opsional)
   ===================================================================== */
const WORKS = [

  // ── WEB DESIGN ───────────────────────────────────
  {
    category: "web",
    emoji:    "🌐",
    title:    "Portfolio Website",
    desc:     "Personal portfolio website built with pure HTML, CSS & JavaScript. Dark mode, animated profile ring, skills section.",
    tags:     ["HTML", "CSS", "JavaScript"],
    image:    "",
    link:     "https://herlytaqotrun.github.io/portfolio",
    linkText: "View Live →",
  },
  {
    category: "web",
    emoji:    "⚙️",
    title:    "Full-Stack Web App — Adiva Solution",
    desc:     "Enterprise fullstack web application with Laravel backend and React.js frontend. 99% uptime, sub-second API response.",
    tags:     ["Laravel", "React.js", "RESTful API", "MySQL"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── PRODUCT DESIGN ──────────────────────────────
  {
    category: "product",
    emoji:    "📐",
    title:    "LMS Platform Design",
    desc:     "Designed and scaled digital learning management system serving 500+ users with 4.8/5.0 satisfaction score.",
    tags:     ["UX Design", "LMS", "User Flows"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── GRAPHIC DESIGN ──────────────────────────────
  {
    category: "graphic",
    emoji:    "🎨",
    title:    "Brand & Visual Assets",
    desc:     "Social media visuals, banners, and marketing materials created with Adobe Photoshop, Illustrator, and Canva.",
    tags:     ["Adobe Photoshop", "Illustrator", "Canva"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── VISUAL DESIGN ───────────────────────────────
  {
    category: "visual",
    emoji:    "✨",
    title:    "AI-Enhanced Digital Visuals",
    desc:     "Digital visuals combining traditional design skills with AI tools (Runway, Firefly, Midjourney) for high-impact media.",
    tags:     ["Figma", "Canva", "Runway", "Firefly", "AI"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── COPYWRITING ─────────────────────────────────
  {
    category: "copy",
    emoji:    "✍️",
    title:    "Web & Marketing Copy",
    desc:     "SEO-ready web copy, social media captions, and brand messaging that converts and connects with the right audience.",
    tags:     ["SEO Copywriting", "Brand Copy", "Social Media"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── VIDEO EDITING ───────────────────────────────
  {
    category: "video",
    emoji:    "🎬",
    title:    "Promotional & Cinematic Video",
    desc:     "Promotional videos, explainers, and cinematic edits created with Adobe Premiere, CapCut, and DaVinci Resolve.",
    tags:     ["Adobe Premiere", "CapCut", "DaVinci Resolve"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── DIGITAL MARKETING ───────────────────────────
  {
    category: "marketing",
    emoji:    "📊",
    title:    "Digital Campaign Management",
    desc:     "Planned and executed digital campaigns across Google Ads and Meta Ads — tracked, optimized, and results-driven.",
    tags:     ["Google Ads", "Meta Ads", "SEO", "Analytics"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // ── SOCIAL MEDIA ────────────────────────────────
  {
    category: "social",
    emoji:    "📱",
    title:    "Social Media Strategy & Content",
    desc:     "Content calendars, paid social campaigns, and community management that grew channels with consistent engagement.",
    tags:     ["Content Planning", "Paid Ads", "Analytics"],
    image:    "",
    link:     "",
    linkText: "",
  },

  // Tambah karya baru? Salin satu blok di atas dan paste di sini!

];
/* ===================================================================== */

// Render
function render(filter) {
  const items = filter === 'all' ? WORKS : WORKS.filter(w => w.category === filter);
  const grid  = document.getElementById('pgrid');
  const empty = document.getElementById('empty');

  if (!items.length) { grid.innerHTML = ''; empty.classList.add('show'); return; }
  empty.classList.remove('show');

  grid.innerHTML = items.map(w => {
    const imgEl = (w.image && w.image.trim())
      ? `<img class="p-card-img" src="${w.image}" alt="${w.title}" />`
      : `<div class="p-card-placeholder"><span class="emoji">${w.emoji}</span><span>Foto belum ditambahkan</span></div>`;
    const linkEl = (w.link && w.link.trim())
      ? `<a class="p-card-link" href="${w.link}" target="_blank" rel="noopener">${w.linkText || 'Lihat →'}</a>`
      : '';
    const tags = w.tags.map(t => `<span class="p-tag">${t}</span>`).join('');
    return `<div class="p-card fade-up" data-cat="${w.category}">
      ${imgEl}
      <div class="p-card-body">
        <div class="p-card-cat">${w.category.toUpperCase()}</div>
        <div class="p-card-title">${w.title}</div>
        <div class="p-card-desc">${w.desc}</div>
        <div class="p-card-tags">${tags}</div>
        ${linkEl}
      </div>
    </div>`;
  }).join('');

  // Animate
  setTimeout(() => {
    const io = new IntersectionObserver(e => e.forEach(x => {
      if(x.isIntersecting){x.target.classList.add('visible');io.unobserve(x.target);}
    }), {threshold:.1});
    document.querySelectorAll('.fade-up').forEach(el => io.observe(el));
  }, 50);
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

// Scroll fade
const io = new IntersectionObserver(e => e.forEach(x => {
  if(x.isIntersecting){x.target.classList.add('visible');io.unobserve(x.target);}
}),{threshold:.1});
document.querySelectorAll('.fade-up').forEach(el => io.observe(el));

render('all');
</script>
</body>
</html>
